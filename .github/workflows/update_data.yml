name: Otomatik Film Veri Botu

on:
  schedule:
    - cron: '0 0 * * *' # Her gün gece yarısı çalışır
  workflow_dispatch: # Manuel olarak tetiklenebilir

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Repoyu Kopyala (Checkout)
        uses: actions/checkout@v4

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Gerekli Kütüphaneleri Yükle
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 cloudscraper

      - name: Botu Çalıştır ve JSON Üret
        run: python bot.py

      - name: Değişiklikleri GitHub'a Kaydet
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add filmler.json
          git diff --quiet && git diff --cached --quiet || (git commit -m "Güncel film verileri eklendi [skip ci]" && git push)
